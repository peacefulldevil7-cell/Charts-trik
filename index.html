<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>To‑Do List (LocalStorage)</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="app" aria-labelledby="app-title">
    <header class="header">
      <h1 id="app-title">To‑Do List</h1>
      <p class="subtitle">Simple, fast, and offline — powered by Local Storage</p>
    </header>

    <section class="todo-pane" aria-live="polite">
      <form id="todo-form" class="todo-form" autocomplete="off">
        <input id="todo-input" name="task" type="text" placeholder="Add a new task and press Enter" aria-label="New task" required />
        <input id="url-input" name="url" type="url" placeholder="Optional URL (paste link)" aria-label="URL (optional)" />
        <button id="add-btn" type="submit" aria-label="Add task">Add</button>
      </form>

      <div class="controls">
        <div class="filters" role="tablist" aria-label="Filter tasks">
          <button class="filter-btn active" data-filter="all" role="tab" aria-selected="true">All</button>
          <button class="filter-btn" data-filter="active" role="tab" aria-selected="false">Active</button>
          <button class="filter-btn" data-filter="completed" role="tab" aria-selected="false">Completed</button>
        </div>

        <div class="actions">
          <button id="clear-completed" title="Clear completed tasks">Clear completed</button>
          <button id="export-json" title="Export tasks as JSON">Export</button>
          <button id="import-json" title="Import tasks (JSON)">Import</button>
          <input id="file-input" type="file" accept="application/json" style="display:none" />
        </div>
      </div>

      <ul id="todo-list" class="todo-list" aria-label="To-do list"></ul>

      <div class="footer-bar">
        <span id="items-left" class="items-left">0 items left</span>
        <button id="clear-all" class="danger">Clear all</button>
      </div>
    </section>

    <footer class="credits">
      <small>Local-only To‑Do • No backend • Works offline</small>
    </footer>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
