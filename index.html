<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Historical Chart Analysis</title>
  <link rel="stylesheet" href="css/styles.css">
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <!-- Chart.js zoom plugin -->
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"></script>
  <!-- SheetJS -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>
  <div id="app" class="app">
    <aside class="sidebar">
      <div class="brand">HistoricChart<span class="dot">•</span></div>
      <nav class="menu">
        <button id="btnUpload" class="menu-btn">Upload Chart</button>
        <button id="btnPaste" class="menu-btn">Paste Chart Data</button>
        <button id="btnLoadAnalysis" class="menu-btn">Load Previous Analysis</button>
        <button id="btnRules" class="menu-btn">Rule Manager</button>
        <button id="btnHistory" class="menu-btn">Analysis History</button>
        <button id="btnSettings" class="menu-btn">Settings</button>
      </nav>
      <div class="switch-row">
        <label class="switch">
          <input id="darkModeToggle" type="checkbox">
          <span class="slider"></span>
        </label>
        <small id="themeLabel">Dark Mode</small>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="search">
          <input id="globalSearch" placeholder="Search # / date / pattern / rule" />
          <button id="btnSearch">Search</button>
        </div>
        <div class="actions">
          <button id="btnRunAll" class="primary">Run Analysis</button>
          <button id="btnExportReport">Export Report</button>
        </div>
      </header>

      <section class="dashboard">
        <div class="left-column">
          <div class="card">
            <h3>Chart</h3>
            <div class="chart-area">
              <canvas id="chartCanvas"></canvas>
            </div>
            <div class="chart-controls">
              <button id="btnZoomReset">Reset Zoom</button>
              <label>Series:</label>
              <div id="seriesList" class="series-list"></div>
            </div>
          </div>

          <div class="card">
            <h3>Data Table</h3>
            <div id="tableContainer" class="table-container"></div>
          </div>
        </div>

        <div class="right-column">
          <div class="card">
            <h3>Rule Manager</h3>
            <div id="rulesList" class="rules-list"></div>
            <div class="rule-manager">
              <input id="ruleFileInput" type="file" accept=".js" />
              <button id="btnUploadRule">Upload Rule Module</button>
              <button id="btnOpenRuleEditor">Open Rule Editor</button>
            </div>
          </div>

          <div class="card">
            <h3>Analysis Report</h3>
            <div id="reportContainer" class="report-container">No analysis run yet.</div>
            <div class="report-actions">
              <button id="btnSaveAnalysis">Save Analysis</button>
              <button id="btnExportExcel">Export Excel</button>
              <button id="btnPrintReport">Print</button>
            </div>
          </div>

          <div class="card small">
            <h3>Search Panel</h3>
            <div class="search-panel">
              <input id="searchNumber" placeholder="Search number (e.g. 46)" />
              <button id="btnSearchNumber">Find</button>
              <div id="searchResults" class="search-results"></div>
            </div>
          </div>

        </div>
      </section>
    </main>

    <!-- Hidden inputs & modals -->
    <input id="fileInput" type="file" accept=".xlsx,.xls,.csv,.json,.txt" style="display:none" />
    <div id="pasteModal" class="modal" hidden>
      <div class="modal-content">
        <h3>Paste Chart Data</h3>
        <textarea id="pasteArea" placeholder="Paste CSV / JSON / tabular data here"></textarea>
        <div class="modal-actions">
          <button id="btnPasteCancel">Cancel</button>
          <button id="btnPasteOk">Import</button>
        </div>
      </div>
    </div>

    <footer class="footer">Historic Chart Analysis — Analysis Only — No predictions</footer>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
